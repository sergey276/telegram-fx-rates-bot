[project]
name = "fx-crypto-monitor-bot"
version = "1.0.0"
description = "Telegram-бот мониторинга курсов валют и криптовалют (банки Украины + криптобиржи)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E702", "E741", "E731", "F841", "B015", "B018"]
